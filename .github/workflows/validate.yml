name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  powershell:
    name: PowerShell validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate catalog and README sync
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-Catalog.ps1

      - name: Validate profile JSON helpers
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-ProfileJson.ps1

      - name: Validate profile gallery
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-ProfileGallery.ps1

      - name: Validate WinGet runner helpers
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-WinGetRunner.ps1

      - name: Validate search metadata scoring
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-SearchMetadata.ps1

      - name: Validate package source adapters
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-PackageSources.ps1

      - name: Validate source policy
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-SourcePolicy.ps1

      - name: Validate update watcher
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-UpdateWatcher.ps1

      - name: Validate offline cache
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-OfflineCache.ps1

      - name: Validate WinGet Configuration export
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-ConfigurationExport.ps1

      - name: Validate visual and accessibility rules
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-VisualAccessibility.ps1

      - name: Validate WPF XAML
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File .\tools\Test-Xaml.ps1

      - name: Verify release artifacts
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\Test-ReleaseArtifact.ps1

      - name: Validate launcher bundle
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\Test-Bundle.ps1

      - name: Validate launcher manifest
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\Test-LauncherManifest.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\Test-Analyzer.ps1 -InstallIfMissing
